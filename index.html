<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Banana Challenge</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #70c5ce;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: white;
            margin: 10px 0;
        }

        #main-content {
            display: flex;
            gap: 25px;
            align-items: center;
            justify-content: center;
            padding: 10px;
            width: 100%;
        }

        #game-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            overflow: hidden;
            background: linear-gradient(#70c5ce, #b9e8ff);
            border: 4px solid white;
        }

        #bird {
            position: absolute;
            width: 40px;
            height: 30px;
            left: 80px;
            top: 250px;
            background: yellow;
            border: 3px solid #d99b00;
            border-radius: 50%;
        }

        .pipe {
            position: absolute;
            width: 65px;
            background: #4caf50;
            border: 3px solid #287a2b;
        }

        #score {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px #333;
        }

        #message {
            position: absolute;
            top: 260px;
            width: 100%;
            text-align: center;
            padding: 0 15px;
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 2px #333;
        }

        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Banana challenge */
        #bananaChallenge {
            width: 380px;
            min-height: 400px;
            background: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
        }

        #bananaChallenge h2 {
            margin-top: 0;
        }

        #bananaImage {
            max-width: 100%;
            max-height: 250px;
            display: none;
            margin: 10px auto;
        }

        #answerInput {
            width: 120px;
            padding: 10px;
            font-size: 18px;
            text-align: center;
        }

        #challengeMessage {
            min-height: 25px;
            font-weight: bold;
        }

        @media (max-width: 850px) {
            #main-content {
                flex-direction: column;
            }

            #game-container {
                width: 350px;
                height: 500px;
            }
        }
    </style>
</head>

<body>

    <h1>🐦 Flappy Bird Challenge</h1>

    <div id="main-content">

        <!-- Game -->
        <div id="game-section">
            <div id="game-container">
                <div id="bird"></div>
                <div id="score">Score: 0</div>
                <div id="message">Solve the Banana Challenge first!</div>
            </div>

            <button id="startButton">Load Banana Challenge</button>
        </div>

        <!-- Banana API -->
        <div id="bananaChallenge">
            <h2>🍌 Banana API Challenge</h2>

            <p id="apiStatus">
                Click "Load Banana Challenge" to begin.
            </p>

            <img id="bananaImage" alt="Banana API Challenge">

            <div id="answerSection" style="display: none;">
                <p>Enter your answer:</p>

                <input
                    type="number"
                    id="answerInput"
                    placeholder="Answer"
                >

                <br>

                <button id="submitAnswer">Submit Answer</button>

                <p id="challengeMessage"></p>
            </div>
        </div>

    </div>

    <script src="api.js"></script>
    <script src="game.js"></script>

</body>
</html>
