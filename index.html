<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird Assignment</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #70c5ce;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: white;
            margin: 20px 0 10px;
        }

        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            overflow: hidden;
            background: linear-gradient(#70c5ce 0%, #b9e8ff 100%);
            border: 4px solid white;
        }

        #bird {
            position: absolute;
            width: 40px;
            height: 30px;
            left: 80px;
            top: 250px;
            background: yellow;
            border: 3px solid #d99b00;
            border-radius: 50%;
        }

        .pipe {
            position: absolute;
            width: 65px;
            background: #4caf50;
            border: 3px solid #287a2b;
        }

        #score {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 2px #333;
        }

        #message {
            position: absolute;
            top: 270px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 2px #333;
        }

        button {
            margin: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🐦 Flappy Bird</h1>

    <div id="game-container">
        <div id="bird"></div>
        <div id="score">Score: 0</div>
        <div id="message">Press SPACE or click START!</div>
    </div>

    <button id="startButton">Start Game</button>

    <script src="game.js"></script>
    <script src="api.js"></script>

</body>
</html>
